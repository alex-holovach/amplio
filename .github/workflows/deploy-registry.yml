name: deploy-registry

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "scripts/build-registry.mjs"
      - "public/**"
      - "vercel.json"
      - ".github/workflows/deploy-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-registry
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build registry
        run: node scripts/build-registry.mjs

      - name: Deploy to Vercel (aholovach/amplio)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::Missing Vercel secrets for aholovach/amplio"
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" --scope aholovach
